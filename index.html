<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/src/index.css" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Fuutarou Final Regret</title>
  </head>
  <body>
    <div id="root">
      <div id="bootstrap-loader" class="vn-loading-screen" role="status" aria-label="Cargando recuerdos…">
        <div class="vn-loading-aurora" aria-hidden="true"></div>
        <div class="vn-marble-stage" aria-hidden="true">
          <div class="vn-marble-orbit">
            <span class="vn-marble-runner vn-marble--ichika" style="--marble-index: 0">
              <span class="vn-marble-trail"></span><span class="vn-marble-floor-shadow"></span>
              <span class="vn-marble vn-marble--ichika"><span class="vn-marble-core"></span></span>
            </span>
            <span class="vn-marble-runner vn-marble--nino" style="--marble-index: 1">
              <span class="vn-marble-trail"></span><span class="vn-marble-floor-shadow"></span>
              <span class="vn-marble vn-marble--nino"><span class="vn-marble-core"></span></span>
            </span>
            <span class="vn-marble-runner vn-marble--miku" style="--marble-index: 2">
              <span class="vn-marble-trail"></span><span class="vn-marble-floor-shadow"></span>
              <span class="vn-marble vn-marble--miku"><span class="vn-marble-core"></span></span>
            </span>
            <span class="vn-marble-runner vn-marble--yotsuba" style="--marble-index: 3">
              <span class="vn-marble-trail"></span><span class="vn-marble-floor-shadow"></span>
              <span class="vn-marble vn-marble--yotsuba"><span class="vn-marble-core"></span></span>
            </span>
            <span class="vn-marble-runner vn-marble--itsuki" style="--marble-index: 4">
              <span class="vn-marble-trail"></span><span class="vn-marble-floor-shadow"></span>
              <span class="vn-marble vn-marble--itsuki"><span class="vn-marble-core"></span></span>
            </span>
          </div>
          <div class="vn-marble-horizon"></div>
        </div>
        <div class="vn-loading-copy">
          <span class="vn-loading-kicker">Fuutarou's Final Regret</span>
          <span class="vn-loading-label">Cargando recuerdos…</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
