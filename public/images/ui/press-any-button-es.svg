    <circle cx="34" cy="0" r="5" fill="#8d72d9"/>
    <circle cx="68" cy="0" r="5" fill="#67a8df"/>
    <circle cx="102" cy="0" r="5" fill="#65c894"/>
    <circle cx="136" cy="0" r="5" fill="#ef6c6f"/>
  </g>
  <text x="410" y="76" text-anchor="middle" fill="#fffaf3" stroke="#4c2946" stroke-width="1.5"
