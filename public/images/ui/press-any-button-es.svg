<svg xmlns="http://www.w3.org/2000/svg" width="820" height="116" viewBox="0 0 820 116" role="img" aria-labelledby="title">
  <title id="title">Presiona cualquier botón</title>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#251b31" stop-opacity=".92"/>
      <stop offset=".52" stop-color="#151426" stop-opacity=".9"/>
      <stop offset="1" stop-color="#2c172a" stop-opacity=".92"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#f5bdcf"/>
      <stop offset=".5" stop-color="#fff0bd"/>
      <stop offset="1" stop-color="#d8c5ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-40%" width="140%" height="180%">
