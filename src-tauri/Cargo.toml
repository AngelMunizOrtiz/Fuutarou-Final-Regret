[package]
name = "my-game"
version = "0.1.0"
description = "Fan game of TQQ , Route Miku"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "my_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"


[profile.release]
# Both desktop and Android demos embed the same web runtime. A single LTO unit
# and stripped symbols reduce the launcher size and the amount of native code
# that must be mapped before the WebView can start.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
